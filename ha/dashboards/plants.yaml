  - title: Automations
    path: automations
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: Plant Automations
        filter:
          include:
            - domain: automation
              label: plants
              options:
                secondary_info: last-triggered
                tap_action:
                  action: more-info
        sort:
          method: friendly_name

      - type: custom:auto-entities
        card:
          type: logbook
          title: Automation Log
          hours_to_show: 24
        filter:
          include:
            - domain: automation
              label: plants

  - title: All Devices
    path: devices
    cards:
      - type: entities
        title: Horizontal Grow Light
        entities:
          - entity: sensor.horizontal_grow_light_state
            name: State
          - entity: switch.horizontal_grow_light_control
            name: Control
            icon: mdi:lightbulb

      - type: entities
        title: Vertical Grow Light
        entities:
          - entity: sensor.vertical_grow_light_state
            name: State
          - entity: switch.vertical_grow_light_control
            name: Control
            icon: mdi:lightbulb

      - type: entities
        title: Auto Waterer
        entities:
          - entity: sensor.auto_waterer_state
            name: State
          - entity: switch.auto_waterer_control
            name: Control
            icon: mdi:water-pump

      - type: entities
        title: Humidifier
        entities:
          - entity: sensor.humidifier_state
            name: State
          - entity: switch.humidifier_control
            name: Control
            icon: mdi:air-humidifier

  - title: Graphs
    path: graphs
    cards:
      - type: markdown
        content: |
          # 📊 Soil Moisture History
          Last 48 hours

      - type: history-graph
        title: Alocasia
        entities:
          - entity: sensor.alocasia_moisture
        hours_to_show: 48
        refresh_interval: 300

      - type: history-graph
        title: Majesty Palm
        entities:
          - entity: sensor.majesty_palm_moisture
        hours_to_show: 48
        refresh_interval: 300

      - type: history-graph
        title: Malcolm Ficus
        entities:
          - entity: sensor.malcolm_ficus_moisture
        hours_to_show: 48
        refresh_interval: 300

      - type: history-graph
        title: Olive Tree
        entities:
          - entity: sensor.olive_tree_moisture
        hours_to_show: 48
        refresh_interval: 300

  - title: Humidity
    path: humidity
    cards:
      - type: markdown
        content: |
          # 💧 Air Humidity History
          Indoor vs outdoor comparison

          Sensors:
          - Indoor (Liana, GW1200B)
          - Outdoor (OpenWeatherMap)

      - type: history-graph
        title: Air Humidity - Indoor vs Outdoor
        entities:
          - entity: sensor.liana_humidity_meter
            name: Indoor (Liana)
          - entity: sensor.gw1200b_indoor_humidity
            name: Indoor (GW1200B)
          - entity: sensor.openweathermap_humidity
            name: Outdoor (OpenWeatherMap)
        hours_to_show: 168
        refresh_interval: 300
