          - event.yucca_manual_shower
          - switch.horizontal_grow_light_control
          - switch.vertical_grow_light_control
          - switch.auto_waterer_control
          - switch.humidifier_control

  - title: Automations
    path: automations
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: Plant Automations
        filter:
          include:
            - domain: automation
              label: plants
              options:
                secondary_info: last-triggered
                tap_action:
                  action: more-info
        sort:
          method: friendly_name

