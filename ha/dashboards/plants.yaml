title: 🌿 My Plants
theme: Backend-selected
views:
  - title: Current Status
    path: home
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "[⚙️ Integration Settings](/config/integrations/integration/plants)"
          - type: entities
            title: 🌤️ Outdoors
            entities:
              - entity: sensor.openweathermap_temperature
                name: Temperature
              - entity: sensor.openweathermap_humidity
                name: Humidity
              - entity: sensor.openweathermap_condition
                name: Condition
              - type: section
              - type: attribute
                entity: sun.sun
                attribute: next_rising
                name: 🌅 Sunrise
                format: time
              - type: attribute
                entity: sun.sun
                attribute: next_setting
                name: 🌇 Sunset
                format: time

          - type: markdown
            title: 💡 Devices
            content: |
              {% set h_light = states('sensor.horizontal_grow_light_state') %}
              {% set v_light = states('sensor.vertical_grow_light_state') %}
              {% set humid = states('sensor.humidifier_status') %}
              {% set h_icon = '🟢' if h_light == 'Light is on' else '⚫' %}
              {% set v_icon = '🟢' if v_light == 'Light is on' else '⚫' %}
              {% set hum_icon = '🟢' if humid == 'On' else ('🔴' if humid == 'No Water' else '⚫') %}
              | Device | Status |
              |--------|--------|
              | 💡 Horizontal Light | {{ h_icon }} {{ 'On' if h_light == 'Light is on' else 'Off' }} |
              | 💡 Vertical Light | {{ v_icon }} {{ 'On' if v_light == 'Light is on' else 'Off' }} |
              | 💧 Humidifier | {{ hum_icon }} {{ humid }} |

          - type: markdown
            title: 🌱 Plant Status
            content: |
              {% set plants = ['dracaena','ficus_elastica_robusta','ficus_elastica_tineke','liana','malcolm_ficus','olive_tree','rubber_plant','triangularis_ficus','yucca'] %}
              {% set names = {'dracaena':'Dracaena','ficus_elastica_robusta':'Ficus Elastica Robusta','ficus_elastica_tineke':'Ficus Elastica Tineke','liana':'Liana','malcolm_ficus':'Malcolm Ficus','olive_tree':'Olive Tree','rubber_plant':'Rubber Plant','triangularis_ficus':'Triangularis Ficus','yucca':'Yucca'} %}
              {% set mv = {'dracaena':'sensor.dracaena_soil_moisture_state','ficus_elastica_robusta':'sensor.ficus_elastica_robusta_soil_moisture_state','ficus_elastica_tineke':'sensor.ficus_elastica_tineke_soil_moisture_state','liana':'sensor.liana_moisture','malcolm_ficus':'sensor.malcolm_ficus_moisture','olive_tree':'sensor.olive_tree_moisture','rubber_plant':'sensor.rubber_plant_moisture','triangularis_ficus':'sensor.triangularis_ficus_moisture','yucca':'sensor.yucca_moisture'} %}
              {% macro zone_icon(z) %}{% if z=='red' %}🔴{% elif z=='yellow' %}🟡{% elif z=='green' %}🟢{% else %}⚪{% endif %}{% endmacro %}
              | Plant | 🌿 Soil | 💧 Humidity | 🌡️ Temp |
              |-------|---------|------------|---------|
              {% for p in plants %}{% set mzone = states('sensor.' ~ p ~ '_soil_moisture_zone') %}{% set hzone = states('sensor.' ~ p ~ '_air_humidity_zone') %}{% set tzone = states('sensor.' ~ p ~ '_air_temperature_zone') %}{% set mval = states(mv[p]) %}{% set hval_air = states('sensor.' ~ p ~ '_air_humidity_meter') %}{% set hval = hval_air if hval_air | float(-1) >= 0 else states('sensor.' ~ p ~ '_humidity_meter') %}{% set tval = states('sensor.' ~ p ~ '_air_temperature_meter') %}{% set mthresh = states('number.' ~ p ~ '_soil_moisture_yellow_threshold') | int %}{% set hmin = states('number.' ~ p ~ '_air_humidity_min') | int %}{% set hmax = states('number.' ~ p ~ '_air_humidity_max') | int %}{% set tmin = states('number.' ~ p ~ '_air_temperature_min') | int %}{% set tmax = states('number.' ~ p ~ '_air_temperature_max') | int %}{% set m_ok = mval | float(-1) >= 0 %}{% set h_ok = hval | float(-1) >= 0 %}{% set t_ok = tval | float(-1) >= 0 %}| {{ names[p] }} | {{ zone_icon(mzone) }} {% if m_ok %}{{ mval | float | round(0) | int }}% (green >{{ mthresh }}%){% else %}—{% endif %} | {{ zone_icon(hzone) }} {% if h_ok %}{{ hval | float | round(0) | int }}% (needed {{ hmin }}–{{ hmax }}%){% else %}—{% endif %} | {{ zone_icon(tzone) }} {% if t_ok %}{{ tval | float | round(1) }}°F (needed {{ tmin }}–{{ tmax }}°F){% else %}—{% endif %} |
              {% endfor %}


