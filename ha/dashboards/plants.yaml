title: 🌿 My Plants
theme: Backend-selected
views:
  - title: Current Status
    path: home
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "[⚙️ Integration Settings](/config/integrations/integration/plants)"
          - type: entities
            title: 🌤️ Outdoors
            entities:
              - entity: sensor.openweathermap_temperature
                name: Temperature
              - entity: sensor.openweathermap_humidity
                name: Humidity
              - entity: sensor.openweathermap_condition
                name: Condition
              - type: section
              - type: attribute
                entity: sun.sun
                attribute: next_rising
                name: 🌅 Sunrise
                format: time
              - type: attribute
                entity: sun.sun
                attribute: next_setting
                name: 🌇 Sunset
                format: time

          - type: markdown
            title: 🌱 Plant Status
            content: |
              {% set plants = ['alocasia','dracaena','ficus_elastica_robusta','ficus_elastica_tineke','liana','majesty_palm','malcolm_ficus','maranta','olive_tree','philodendron','rubber_plant','triangularis_ficus','yucca'] %}
              {% set names = {'alocasia':'Alocasia','dracaena':'Dracaena','ficus_elastica_robusta':'Ficus Elastica Robusta','ficus_elastica_tineke':'Ficus Elastica Tineke','liana':'Liana','majesty_palm':'Majesty Palm','malcolm_ficus':'Malcolm Ficus','maranta':'Maranta','olive_tree':'Olive Tree','philodendron':'Philodendron','rubber_plant':'Rubber Plant','triangularis_ficus':'Triangularis Ficus','yucca':'Yucca'} %}
              {% set mv = {'alocasia':'sensor.alocasia_moisture','dracaena':'sensor.dracaena_soil_moisture_state','ficus_elastica_robusta':'sensor.ficus_elastica_robusta_soil_moisture_state','ficus_elastica_tineke':'sensor.ficus_elastica_tineke_soil_moisture_state','liana':'sensor.liana_moisture','majesty_palm':'sensor.majesty_palm_moisture','malcolm_ficus':'sensor.malcolm_ficus_moisture','maranta':'sensor.maranta_soil_moisture_state','olive_tree':'sensor.olive_tree_moisture','philodendron':'sensor.philodendron_soil_moisture_state','rubber_plant':'sensor.rubber_plant_moisture','triangularis_ficus':'sensor.triangularis_ficus_moisture','yucca':'sensor.yucca_moisture'} %}
              {% macro zone_icon(z) %}{% if z=='red' %}🔴{% elif z=='yellow' %}🟡{% elif z=='green' %}🟢{% else %}⚪{% endif %}{% endmacro %}
              | Plant | 🌿 Soil | 💧 Humidity | 🌡️ Temp |
              |-------|---------|------------|---------|
              {% for p in plants %}{% set mzone = states('sensor.' ~ p ~ '_soil_moisture_zone') %}{% set hzone = states('sensor.' ~ p ~ '_air_humidity_zone') %}{% set tzone = states('sensor.' ~ p ~ '_air_temperature_zone') %}{% set mval = states(mv[p]) %}{% set hval = states('sensor.' ~ p ~ '_air_humidity_meter') %}{% set tval = states('sensor.' ~ p ~ '_air_temperature_meter') %}{% set mthresh = states('number.' ~ p ~ '_soil_moisture_yellow_threshold') | int %}{% set hmin = states('number.' ~ p ~ '_air_humidity_min') | int %}{% set hmax = states('number.' ~ p ~ '_air_humidity_max') | int %}{% set tmin = states('number.' ~ p ~ '_air_temperature_min') | int %}{% set tmax = states('number.' ~ p ~ '_air_temperature_max') | int %}{% set m_ok = mval | float(-1) >= 0 %}{% set h_ok = hval | float(-1) >= 0 %}{% set t_ok = tval | float(-1) >= 0 %}| {{ names[p] }} | {{ zone_icon(mzone) }} {% if m_ok %}{{ mval | float | round(0) | int }}% (green >{{ mthresh }}%){% else %}—{% endif %} | {{ zone_icon(hzone) }} {% if h_ok %}{{ hval | float | round(0) | int }}% (needed {{ hmin }}–{{ hmax }}%){% else %}—{% endif %} | {{ zone_icon(tzone) }} {% if t_ok %}{{ tval | float | round(1) }}°F (needed {{ tmin }}–{{ tmax }}°F){% else %}—{% endif %} |
              {% endfor %}


  - title: All Plants
    path: all-plants
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: 🌿 Alocasia
        filter:
          include:
            - entity_id: "*alocasia*"
              domain: sensor
            - entity_id: "*alocasia*"
              domain: number
            - entity_id: "*alocasia*"
              domain: text
        sort:
          method: entity_id

