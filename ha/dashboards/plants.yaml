title: 🌿 My Plants
theme: Backend-selected
views:
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # 🌱 Welcome to the Garden!
              **{{ now().strftime('%A, %d %B %Y') }}**

              You have **14 plants** 🌿
              **4 soil moisture sensors** 💧

      - title: 🌿 Plants with Moisture Sensors
        type: grid
        cards:
          - type: gauge
            entity: sensor.alocasia_moisture
            name: 🌿 Alocasia
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 40
              yellow: 30
              red: 0
            needle: true

          - type: gauge
            entity: sensor.majesty_palm_moisture
            name: 🌴 Majesty Palm
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 45
              yellow: 30
              red: 0
            needle: true

          - type: gauge
            entity: sensor.malcolm_ficus_moisture
            name: 🌳 Malcolm Ficus
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 35
              yellow: 25
              red: 0
            needle: true

          - type: gauge
            entity: sensor.olive_tree_moisture
            name: 🫒 Olive Tree
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 25
              yellow: 15
              red: 0
            needle: true

      - title: 🌡️ Indoor Climate
        type: grid
        cards:
          - type: gauge
            entity: sensor.liana_humidity_meter
            name: Air Humidity
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 50
              yellow: 40
              red: 0
            needle: true

          - type: gauge
            entity: sensor.liana_air_temperature_meter
            name: Temperature
            unit: "°F"
            min: 60
            max: 85
            severity:
              green: 70
              yellow: 65
              red: 60
            needle: true

