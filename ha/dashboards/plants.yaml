  - title: Agent
    path: agent
    cards:
      - type: markdown
        title: 🤖 Issues Log
        content: |
          {% set items = state_attr('sensor.agent_log_plant_check_issues', 'items') %}
          {% if not items %}
          _No issues recorded yet._
          {% else %}
          {% for item in items %}- {{ item }}
          {% endfor %}
          {% endif %}

      - type: markdown
        title: ⚡ Actions Log
        content: |
          {% set items = state_attr('sensor.agent_log_plant_check_actions', 'items') %}
          {% if not items %}
          _No actions recorded yet._
          {% else %}
          ```
          {% for item in items %}{{ item }}
          {% endfor %}
          ```
          {% endif %}

