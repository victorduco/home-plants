title: 🌿 My Plants
theme: Backend-selected
views:
  - title: Overview
    path: home
    cards:
      - type: markdown
        content: |
          # 🌱 Welcome to the Garden!
          **{{ now().strftime('%A, %d %B %Y') }}**

          [⚙️ Integration Settings](/config/integrations/integration/plants)

      - type: markdown
        content: |
          🌅 Sunrise: {{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%-I:%M %p') }}
          🌇 Sunset: {{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%-I:%M %p') }}

      - type: entities
