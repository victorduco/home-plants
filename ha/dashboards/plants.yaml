  - title: All Devices
    path: devices-2
    cards:
      - type: entities
        title: Horizontal Grow Light
        entities:
          - entity: sensor.horizontal_grow_light_state
            name: State
          - entity: switch.horizontal_grow_light_control
            name: Control
            icon: mdi:lightbulb

      - type: entities
        title: Vertical Grow Light
        entities:
          - entity: sensor.vertical_grow_light_state
            name: State
          - entity: switch.vertical_grow_light_control
            name: Control
            icon: mdi:lightbulb

      - type: entities
        title: Auto Waterer
        entities:
          - entity: sensor.auto_waterer_state
            name: State
          - entity: switch.auto_waterer_control
            name: Control
            icon: mdi:water-pump

      - type: entities
        title: Humidifier
        entities:
          - entity: sensor.humidifier_state
            name: State
          - entity: switch.humidifier_control
            name: Control
            icon: mdi:air-humidifier

  - title: Journal
    path: journal
    cards:
      - type: logbook
        title: 📋 Plant Care Journal
        hours_to_show: 720
        entities:
          - event.alocasia_manual_watering
          - event.alocasia_auto_watering
          - event.alocasia_manual_shower
          - event.dracaena_manual_watering
          - event.dracaena_auto_watering
          - event.dracaena_manual_shower
          - event.ficus_elastica_robusta_manual_watering
          - event.ficus_elastica_robusta_auto_watering
          - event.ficus_elastica_robusta_manual_shower
          - event.ficus_elastica_tineke_manual_watering
          - event.ficus_elastica_tineke_auto_watering
          - event.ficus_elastica_tineke_manual_shower
          - event.liana_manual_watering
          - event.liana_auto_watering
          - event.liana_manual_shower
          - event.majesty_palm_manual_watering
          - event.majesty_palm_auto_watering
          - event.majesty_palm_manual_shower
          - event.malcolm_ficus_manual_watering
          - event.malcolm_ficus_auto_watering
          - event.malcolm_ficus_manual_shower
          - event.maranta_manual_watering
          - event.maranta_auto_watering
          - event.maranta_manual_shower
          - event.olive_tree_manual_watering
          - event.olive_tree_auto_watering
          - event.olive_tree_manual_shower
          - event.philodendron_manual_watering
          - event.philodendron_auto_watering
