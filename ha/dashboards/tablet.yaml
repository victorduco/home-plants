title: 🌿 Tablet
theme: Backend-selected
views:
  - title: Plants
    path: home
    panel: true
    card_mod:
      style: |
        hui-view,
        hui-view > *,
        hui-panel-view,
        hui-panel-view > *,
        .ha-scrollbar,
        #view { padding: 0 !important; margin: 0 !important; }
    cards:
      - type: vertical-stack
        card_mod:
          style: |
            #root {
              position: relative;
              height: 100vh;
              margin: 0 !important;
            }
            #root > * { margin: 0 !important; }
        cards:
          - type: custom:html-template-card
            ignore_line_breaks: true
            card_mod:
              style: |
                ha-card { padding: 0 !important; }
            content: |
              <style>
                :host, html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
                hui-view, .ha-scrollbar, #view { padding: 0 !important; margin: 0 !important; }
                .tablet-wrap {
                  width: 100vw;
                  height: 100vh;
                  background: #111;
                  display: grid;
                  grid-template-columns: repeat(9, 1fr);
                  grid-template-rows: repeat(3, 1fr);
                  gap: 0;
                  box-sizing: border-box;
                }
                .cell {
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: flex-start;
                  padding: 8px 4px;
                  position: relative;
                  border: 1px solid rgba(255,255,255,0.2);
                }
                .cell-label {
                  color: #fff;
                  font-family: sans-serif;
                  font-weight: 400;
                  font-size: clamp(0.7rem, 1.3vw, 1.1rem);
                  text-align: center;
                  padding: 0 4px;
                }
                .cell-hint {
                  position: absolute;
                  bottom: 8px;
                  color: #fff;
                  font-family: sans-serif;
                  font-size: clamp(0.7rem, 1.3vw, 1.1rem);
                  font-weight: 400;
                  text-align: center;
                }
                .green  { background: #00a85e; }
                .yellow { background: #d4a800; color: rgba(0,0,0,0.7) !important; }
                .red    { background: #cb2535; }
                .stale  { background: #555; color: #fff !important; }
              </style>

              {% set plants = [
                ('dracaena',              'Dracaena'),
                ('ficus_robusta_darker','Ficus Robusta'),
                ('ficus_tineke_lighter', 'Ficus Tineke'),
                ('liana',                 'Liana'),
                ('malcolm_ficus',         'Malcolm Ficus'),
                ('olive_tree',            'Olive Tree'),
                ('rubber_plant',          'Rubber Plant'),
                ('triangularis_ficus',    'Triangularis'),
                ('yucca',                 'Yucca'),
              ] %}
              {% set mv = {'dracaena':'sensor.dracaena_soil_moisture_state','ficus_robusta_darker':'sensor.ficus_robusta_darker_soil_moisture_state','ficus_tineke_lighter':'sensor.ficus_tineke_lighter_soil_moisture_state','liana':'sensor.liana_moisture','malcolm_ficus':'sensor.malcolm_ficus_moisture','olive_tree':'sensor.olive_tree_moisture','rubber_plant':'sensor.rubber_plant_moisture','triangularis_ficus':'sensor.triangularis_ficus_moisture','yucca':'sensor.yucca_moisture'} %}

              <div class="tablet-wrap">

                {# Row 1: soil moisture #}
                {% for (p, name) in plants %}
                  {% set zone  = states('sensor.' ~ p ~ '_soil_moisture_zone') %}
                  {% set val   = states(mv[p]) | float(-1) %}
                  {% set yth   = states('number.' ~ p ~ '_soil_moisture_yellow_threshold') | float(0) %}
                  {% set rth   = states('number.' ~ p ~ '_soil_moisture_red_threshold') | float(0) %}
                  {% set cls   = 'green' if zone == 'green' else ('yellow' if zone == 'yellow' else ('stale' if zone == 'stale' else 'red')) %}
                  {% set diff  = (val - yth) | round(0) | int if val >= 0 else none %}
                  <div class="cell {{ cls }}">
                    <span class="cell-label">{{ name }}</span>
                    {% if cls == 'red' %}
                      {% if val < 0 %}
                        <span class="cell-hint">~ no data</span>
                      {% elif diff < 0 %}
                        <span class="cell-hint">~ {{ diff }}%</span>
                      {% else %}
                        <span class="cell-hint">~ +{{ diff }}%</span>
                      {% endif %}
                    {% elif cls == 'stale' %}
                      <span class="cell-hint">⚠ stale</span>
                    {% endif %}
                  </div>
                {% endfor %}

                {# Row 2: air humidity #}
                {% for (p, name) in plants %}
                  {% set zone  = states('sensor.' ~ p ~ '_air_humidity_zone') %}
                  {% set val_air = states('sensor.' ~ p ~ '_air_humidity_meter') | float(-1) %}
                  {% set val = val_air if val_air >= 0 else states('sensor.' ~ p ~ '_humidity_meter') | float(-1) %}
                  {% set hmin  = states('number.' ~ p ~ '_air_humidity_min') | float(0) %}
                  {% set hmax  = states('number.' ~ p ~ '_air_humidity_max') | float(0) %}
                  {% set cls   = 'green' if zone == 'green' else ('yellow' if zone == 'yellow' else ('stale' if zone == 'stale' else 'red')) %}
                  {% if val < hmin %}
                    {% set diff = (val - hmin) | round(0) | int %}
                  {% elif val > hmax %}
                    {% set diff = (val - hmax) | round(0) | int %}
                  {% else %}
                    {% set diff = none %}
                  {% endif %}
                  <div class="cell {{ cls }}">
                    {% if cls == 'red' %}
                      {% if val < 0 %}
                        <span class="cell-hint">% no data</span>
                      {% elif diff is not none and diff < 0 %}
                        <span class="cell-hint">% {{ diff }}%</span>
                      {% elif diff is not none %}
                        <span class="cell-hint">% +{{ diff }}%</span>
                      {% endif %}
                    {% elif cls == 'stale' %}
                      <span class="cell-hint">⚠ stale</span>
                    {% endif %}
                  </div>
                {% endfor %}

                {# Row 3: temperature #}
                {% for (p, name) in plants %}
                  {% set zone  = states('sensor.' ~ p ~ '_air_temperature_zone') %}
                  {% set val   = states('sensor.' ~ p ~ '_air_temperature_meter') | float(-1) %}
                  {% set tmin  = states('number.' ~ p ~ '_air_temperature_min') | float(0) %}
                  {% set tmax  = states('number.' ~ p ~ '_air_temperature_max') | float(0) %}
                  {% set cls   = 'green' if zone == 'green' else ('yellow' if zone == 'yellow' else ('stale' if zone == 'stale' else 'red')) %}
                  {% if val < tmin %}
                    {% set diff = (val - tmin) | round(1) %}
                  {% elif val > tmax %}
                    {% set diff = (val - tmax) | round(1) %}
                  {% else %}
                    {% set diff = none %}
                  {% endif %}
                  <div class="cell {{ cls }}">
                    {% if cls == 'red' %}
                      {% if val < 0 %}
                        <span class="cell-hint">° no data</span>
                      {% elif diff is not none and diff < 0 %}
                        <span class="cell-hint">° {{ diff }}°F</span>
                      {% elif diff is not none %}
                        <span class="cell-hint">° +{{ diff }}°F</span>
                      {% endif %}
                    {% elif cls == 'stale' %}
                      <span class="cell-hint">⚠ stale</span>
                    {% endif %}
                  </div>
                {% endfor %}

              </div>
          - type: conditional
            conditions:
            - entity: sensor.dracaena_soil_moisture_zone
              state: green
            card:
              type: custom:apexcharts-card
              graph_span: 7d
              chart_type: line
              header:
                show: false
              show:
                loading: false
              card_mod:
                style: |
                  :host {
                    position: absolute;
                    left: 3.333vw;
                    top: calc(33.333vh - 6.667vh - 10px);
                    width: 4.444vw;
                    height: 6.667vh;
                    z-index: 3;
                    pointer-events: none;
                  }
                  ha-card {
                    width: 100%;
                    height: 100%;
                    min-height: 0;
                    background: none !important;
                    border: none !important;
                    box-shadow: none !important;
                    padding: 0 !important;
                    margin: 0 !important;
                    overflow: hidden;
                  }
              apex_config:
                chart:
                  sparkline:
                    enabled: true
                  height: 100%
                  width: 100%
                  animations:
                    enabled: false
                  background: transparent
                  parentHeightOffset: 0
                grid:
                  show: false
                  padding:
                    left: 1
                    right: 1
                    top: 4
                    bottom: 4
                yaxis:
                  show: false
                  forceNiceScale: true
                tooltip:
                  enabled: false
                legend:
                  show: false
                dataLabels:
                  enabled: false
                markers:
                  size: 0
              series:
              - entity: sensor.gw1200b_soil_moisture_1
                color: '#ffffff'
                stroke_width: 1.6
                curve: smooth
                statistics:
