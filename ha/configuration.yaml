# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Prevent the legacy tablet WebView from restoring hundreds of identical Jinja
# subscriptions after a reconnect. The guard affects only the plant tablet template.
render_template_guard:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Lovelace Dashboards
lovelace:
  mode: storage
  dashboards:
    plants-dashboard:
      mode: yaml
      title: Plants
      icon: mdi:flower
      show_in_sidebar: true
      filename: dashboards/plants.yaml
    tablet-dashboard:
      mode: yaml
      title: Tablet
      icon: mdi:tablet
      show_in_sidebar: true
      filename: dashboards/tablet.yaml

sensor:
  - platform: statistics
    name: "Indoor Humidity 30min Average"
    unique_id: "stat_indoor_humidity_30min_mean"
    entity_id: sensor.gw1200b_indoor_humidity
    state_characteristic: mean
    max_age:
      minutes: 30
  - platform: statistics
    name: "Indoor Humidity 30min Change"
    unique_id: "stat_indoor_humidity_30min_change"
    entity_id: sensor.gw1200b_indoor_humidity
    state_characteristic: change
    max_age:
      minutes: 30
  - platform: statistics
    name: "Indoor Humidity 2h Change"
    unique_id: "stat_indoor_humidity_2h_change"
    entity_id: sensor.gw1200b_indoor_humidity
    state_characteristic: change
    max_age:
      hours: 2
  - platform: statistics
    name: "Indoor Temperature 2h Change"
    unique_id: "stat_indoor_temperature_2h_change"
    entity_id: sensor.gw1200b_indoor_temperature
    state_characteristic: change
    max_age:
      hours: 2

template:
  - sensor:
      - name: "Humidifier Status"
        unique_id: "tpl_humidifier_status"
        state: >
          {% if is_state('switch.humidifier_control', 'off') %}
            Off
          {% elif states('sensor.indoor_humidity_30min_average') | float(0) >= 50
             or states('sensor.indoor_humidity_30min_change') | float(0) >= 5 %}
            On
          {% else %}
            No Water
          {% endif %}
        icon: >
          {% if is_state('switch.humidifier_control', 'off') %}
            mdi:air-humidifier-off
          {% elif states('sensor.indoor_humidity_30min_average') | float(0) >= 50
             or states('sensor.indoor_humidity_30min_change') | float(0) >= 5 %}
            mdi:air-humidifier
          {% else %}
            mdi:water-alert
          {% endif %}

  - sensor:
      - name: "Alocasia Moisture Yellow Threshold"
        unique_id: "tpl_alocasia_moisture_yellow"
        state: "{{ states('number.alocasia_soil_moisture_yellow_threshold') | float(30) }}"
        unit_of_measurement: "%"
      - name: "Alocasia Moisture Red Threshold"
        unique_id: "tpl_alocasia_moisture_red"
        state: "{{ states('number.alocasia_soil_moisture_red_threshold') | float(15) }}"
        unit_of_measurement: "%"
      - name: "Majesty Palm Moisture Yellow Threshold"
        unique_id: "tpl_majesty_palm_moisture_yellow"
        state: "{{ states('number.majesty_palm_soil_moisture_yellow_threshold') | float(30) }}"
        unit_of_measurement: "%"
      - name: "Majesty Palm Moisture Red Threshold"
        unique_id: "tpl_majesty_palm_moisture_red"
        state: "{{ states('number.majesty_palm_soil_moisture_red_threshold') | float(15) }}"
        unit_of_measurement: "%"
      - name: "Malcolm Ficus Moisture Yellow Threshold"
        unique_id: "tpl_malcolm_ficus_moisture_yellow"
        state: "{{ states('number.malcolm_ficus_soil_moisture_yellow_threshold') | float(30) }}"
        unit_of_measurement: "%"
      - name: "Malcolm Ficus Moisture Red Threshold"
        unique_id: "tpl_malcolm_ficus_moisture_red"
        state: "{{ states('number.malcolm_ficus_soil_moisture_red_threshold') | float(15) }}"
        unit_of_measurement: "%"
      - name: "Olive Tree Moisture Yellow Threshold"
        unique_id: "tpl_olive_tree_moisture_yellow"
        state: "{{ states('number.olive_tree_soil_moisture_yellow_threshold') | float(30) }}"
        unit_of_measurement: "%"
      - name: "Olive Tree Moisture Red Threshold"
        unique_id: "tpl_olive_tree_moisture_red"
        state: "{{ states('number.olive_tree_soil_moisture_red_threshold') | float(15) }}"
        unit_of_measurement: "%"
